name: perft

# Compiles the engine and checks the move generator against the reference perft values.
on: [push, pull_request]

jobs:
  perft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: javac -d out $(find src/main/java bench -name "*.java")
      - name: Perft depth 1-8 (no arena games)
        run: |
          java -cp out Benchmark 8 0 | tee perft.txt
          ! grep -q MISMATCH perft.txt
